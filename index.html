<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>an archive of play</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app" id="app">

  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

  <aside class="sidebar" id="sidebar">
    <nav class="nav-section">
      <div class="nav-label">all photos</div>
      <button class="nav-item active" data-collection="all" id="nav-all">
        <span class="nav-item-preview" id="nav-all-preview"></span>
        <span class="nav-item-name">library</span>
      </button>
    </nav>

    <nav class="nav-section" id="collections-nav">
      <div class="nav-label">collections</div>
      <!-- injected by js -->
    </nav>

    <div class="nav-section">
      <button class="shuffle-btn" id="shuffle-btn" title="Re-scatter the library">⟲ shuffle</button>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="collection-title" id="collection-title">all photos</h1>
        <div class="collection-blurb" id="collection-blurb"></div>
      </div>
      <div class="brand">
        <div class="brand-name">time well wasted!</div>
        <div class="brand-sub">an archive of play</div>
      </div>
      <span class="collection-count" id="collection-count"></span>
    </header>

    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas" id="canvas"></div>
    </div>
  </main>

  <div class="meta-panel" id="meta-panel">
    <div class="meta-grid">
      <div class="meta-field"><span class="meta-key">image name:</span><span class="meta-val" id="meta-name"></span></div>
      <div class="meta-field"><span class="meta-key">type:</span><span class="meta-val" id="meta-type"></span></div>
      <div class="meta-field"><span class="meta-key">kept because:</span><span class="meta-val" id="meta-kept"></span></div>
      <div class="meta-field"><span class="meta-key">source:</span><span class="meta-val" id="meta-source"></span></div>
      <div class="meta-field"><span class="meta-key">when:</span><span class="meta-val" id="meta-when"></span></div>
      <div class="meta-field"><span class="meta-key">where:</span><span class="meta-val" id="meta-where"></span></div>
      <div class="meta-field"><span class="meta-key">returned to:</span><span class="meta-val" id="meta-returned"></span></div>
      <div class="meta-field"><span class="meta-key">connection:</span><span class="meta-val" id="meta-connection"></span></div>
    </div>
  </div>

  <div class="isolation" id="isolation" hidden>
    <button class="isolation-close" id="isolation-close" aria-label="Close">✕</button>

    <div class="isolation-trail" id="isolation-trail"></div>

    <div class="isolation-stage">
      <div class="isolation-paths isolation-paths-left" id="paths-left"></div>
      <img class="isolation-image" id="isolation-image" alt="" />
      <div class="isolation-paths isolation-paths-right" id="paths-right"></div>
    </div>

    <div class="isolation-hint">choose a direction, or wander back through the trail above</div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
